name: Run tests

# yamllint disable-line rule:truthy
on:
    # Žádný push trigger: dva checky stejného jména „Run tests job“ na jednom
    # commitu blokují PR, protože zrušený běh se v required status checks
    # počítá jako selhání (a „Run tests job“ na main required je). Který běh
    # zrušení potká je závod, takže se to nedá obejít branch protection.
    #
    # Ze stejného důvodu chybí `ready_for_review`: padal na commit, který už testoval
    # `opened`/`synchronize`, a ještě běžící běh zrušil. Funguje jen proto, že se
    # testuje i draft — kdo přidá filtr na draft, musí `ready_for_review` vrátit.
    #
    # Push do beta a main testuje deploy-beta.yml / deploy-ostra.yml, ovšem
    # jen phpunit — PHPStan, ECS, kontrolu vendor/ a .dockerignore, UI testy ani kontrolu zbuildovaného UI tam nikdo nepustí.
    workflow_dispatch:
        inputs:
            branch:
                description: 'Branch to run tests on'
                required: false
                default: 'main'
    # Bez filtru na cílovou větev: testy potřebuje i PR mířící do feature
    # větve. Dlouhé větve (e-shop) se skládají ze sub-PR, které se mergují
    # do ní, ne do main — a právě ty by jinak nikdo neotestoval.
    pull_request:
        types:
            - opened
            - synchronize
            - reopened

# Nové pushnutí do PR ruší předchozí, ještě běžící testy téže větve –
# na starší commit už stejně nikdo nečeká. Druhý běh nad týmž commitem by ale
# zrušil i ten první, proto `types:` nahoře na jeden commit dvakrát nepadají —
# s výjimkou ručního zavření a znovuotevření PR, dokud testy ještě běží.
concurrency:
    group: run-tests-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    run-tests:
        strategy:
            fail-fast: false

        name: Run tests job
        runs-on: ubuntu-24.04

        steps:

            -   name: Checkout code
                uses: actions/checkout@v4

            -   name: Build and start containers
                run: docker compose up --build --detach

            # Co který krok dělá, určuje Makefile, takže lokální `make ci` a tenhle workflow
            # nespouštějí jiné příkazy. Bez `make deps`: vendor/ je commitnutý.
            -   name: Check vendor/ still matches composer.lock
                run: make check-vendor-matches-lock

            -   name: Run tests in container
                run: make tests-be

            -   name: Run PHPStan in container
                run: make phpstan

            -   name: Run ECS in container
                run: make ecs

            -   name: Check .dockerignore still matches composer.lock
                run: make check-dockerignore

            -   name: Install UI dependencies
                run: make ui-deps

            -   name: Run UI tests
                run: make test-ui

            -   name: Check committed UI bundles match ui/src
                run: make check-ui-bundles

            -   name: Upload test output as artifact
                if: always()
                uses: actions/upload-artifact@v4
                with:
                    name: php-test-logs
                    path: ./tests/logs
