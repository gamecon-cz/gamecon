name: Run tests

# yamllint disable-line rule:truthy
on:
    # Žádný push trigger: dva checky stejného jména „Run tests job“ na jednom
    # commitu blokují PR, protože zrušený běh se v required status checks
    # počítá jako selhání (a „Run tests job“ na main required je). Který běh
    # zrušení potká je závod, takže se to nedá obejít branch protection.
    #
    # Jeden trigger na to ale nestačí: dva `types:` níž můžou padnout na týž
    # commit a jeden z nich concurrency zruší. Stalo se, zatím bez následku.
    #
    # Push do beta a main testuje deploy-beta.yml / deploy-ostra.yml, ovšem
    # jen phpunit — PHPStan, ECS ani kontrolu .dockerignore tam nikdo nepustí.
    workflow_dispatch:
        inputs:
            branch:
                description: 'Branch to run tests on'
                required: false
                default: 'main'
    # Bez filtru na cílovou větev: testy potřebuje i PR mířící do feature
    # větve. Dlouhé větve (e-shop) se skládají ze sub-PR, které se mergují
    # do ní, ne do main — a právě ty by jinak nikdo neotestoval.
    pull_request:
        types:
            - opened
            - synchronize
            - reopened
            - ready_for_review

# Nové pushnutí do PR ruší předchozí, ještě běžící testy téže větve –
# na starší commit už stejně nikdo nečeká. Klíčujeme na větev, ne na SHA:
# zrušen tak může být jen běh nad commitem, který byl mezitím přepsán, a
# nikdy ne druhý běh nad tím samým commitem.
concurrency:
    group: run-tests-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    run-tests:
        strategy:
            fail-fast: false

        name: Run tests job
        runs-on: ubuntu-24.04

        steps:

            -   name: Checkout code
                uses: actions/checkout@v4

            -   name: Build and start containers
                run: docker compose up --build --detach

            -   name: Run tests in container
                run: docker compose exec --no-TTY --user www-data web ./bin/phpunit.sh

            -   name: Run PHPStan in container
                run: docker compose exec --no-TTY --user www-data web ./bin/phpstan.sh

            -   name: Run ECS in container
                run: docker compose exec --no-TTY --user www-data web ./bin/ecs.sh

            -   name: Check .dockerignore still matches composer.lock
                run: docker compose exec --no-TTY --user www-data web php bin/check-dockerignore-dev-vendor.php

            -   name: Upload test output as artifact
                if: always()
                uses: actions/upload-artifact@v4
                with:
                    name: php-test-logs
                    path: ./tests/logs
