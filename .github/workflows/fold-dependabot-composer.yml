name: Fold Dependabot composer updates

# Folds every open Dependabot composer pull request into ONE pull request of our own (the lock commits as Dependabot wrote
# them, `vendor/` synced by `composer install`) and starts the whole `Run tests` on it. It never merges and never touches a
# Dependabot branch. The code that runs packages (composer install) has no token and no secrets; the job that has the token
# runs none of it, and takes from the first one only git objects that it checks. The steps are scripts in
# .github/scripts/dependabot/ (plan, build, publish), so that they run and are tested outside GitHub; this file says what each
# job may do and what it is handed. bin/fold-dependabot-composer.sh, which they call, is the one to use by hand.
# See docs/fold-dependabot-composer.md.

# yamllint disable-line rule:truthy
on:
    workflow_dispatch:
        inputs:
            pull_requests:
                description: 'Numbers of the Dependabot pull requests to fold, separated by spaces; empty folds every open one'
                required: false
                default: ''
    # A `schedule` (for example every three hours) is added once a manual run has produced a good pull request.

# A run is never cancelled: it would leave the branch and the pull request out of step.
concurrency:
    group: fold-dependabot-composer
    cancel-in-progress: false

permissions: {}

env:
    BATCH_BRANCH: security-updates/composer

jobs:
    plan:
        name: Which pull requests, and is the folded one up to date
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        permissions:
            contents: read
            pull-requests: read
        outputs:
            fold: ${{ steps.plan.outputs.fold }}
            pull_requests: ${{ steps.plan.outputs.pull_requests }}
            heads: ${{ steps.plan.outputs.heads }}
            signature: ${{ steps.plan.outputs.signature }}
            branch_tip: ${{ steps.plan.outputs.branch_tip }}
        steps:
            -   uses: actions/checkout@v5
                with:
                    persist-credentials: false

            -   name: Decide
                id: plan
                env:
                    GH_TOKEN: ${{ github.token }}
                    REQUESTED: ${{ inputs.pull_requests }}
                run: .github/scripts/dependabot/plan.sh

    build:
        name: Fold and sync vendor/ (no token, no secrets)
        needs: plan
        if: needs.plan.outputs.fold == 'true'
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        permissions:
            contents: read
        outputs:
            folded: ${{ steps.fold.outputs.folded }}
        steps:
            # Full history: the merge base of an old Dependabot branch is not in a shallow clone.
            -   uses: actions/checkout@v5
                with:
                    fetch-depth: 0
                    persist-credentials: false

            -   name: Fold
                id: fold
                env:
                    HEADS: ${{ needs.plan.outputs.heads }}
                    GIT_AUTHOR_NAME: github-actions[bot]
                    GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
                    GIT_COMMITTER_NAME: github-actions[bot]
                    GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
                run: .github/scripts/dependabot/build.sh

            -   uses: actions/upload-artifact@v4
                if: steps.fold.outputs.folded == 'true'
                with:
                    name: fold
                    path: |
                        ${{ runner.temp }}/fold.bundle
                        ${{ runner.temp }}/fold-summary.txt
                    retention-days: 7

    publish:
        name: Push the branch, write the pull request, start the tests
        needs: [plan, build]
        if: needs.build.outputs.folded == 'true'
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        permissions:
            contents: write
            pull-requests: write
            actions: write
        steps:
            # No credentials stay in the checkout: only the steps that talk to GitHub get the token.
            -   uses: actions/checkout@v5
                with:
                    fetch-depth: 0
                    persist-credentials: false

            -   uses: actions/download-artifact@v4
                with:
                    name: fold
                    path: ${{ runner.temp }}/fold

            -   name: Check what the build produced
                run: .github/scripts/dependabot/publish.sh check

            -   name: Write the brief and the body
                env:
                    PULL_REQUESTS: ${{ needs.plan.outputs.pull_requests }}
                run: .github/scripts/dependabot/publish.sh body

            -   name: Push the branch
                env:
                    GH_TOKEN: ${{ github.token }}
                    BRANCH_TIP: ${{ needs.plan.outputs.branch_tip }}
                run: .github/scripts/dependabot/publish.sh push

            -   name: Open or update the pull request
                id: pull_request
                env:
                    GH_TOKEN: ${{ github.token }}
                run: .github/scripts/dependabot/publish.sh pull-request

            -   name: Start the tests
                env:
                    GH_TOKEN: ${{ github.token }}
                run: .github/scripts/dependabot/publish.sh tests

            -   name: Record that the pull request is up to date
                env:
                    GH_TOKEN: ${{ github.token }}
                    NUMBER: ${{ steps.pull_request.outputs.number }}
                    SIGNATURE: ${{ needs.plan.outputs.signature }}
                run: .github/scripts/dependabot/publish.sh record
