name: Deploy OSTRA (main) on direct push or merged pull request

# yamllint disable-line rule:truthy
on:
    push:
        branches:
            - 'main'
    workflow_dispatch:
        inputs:
            dry_run:
                description: 'Only list what rsync would upload and delete; nothing changes'
                type: boolean
                default: false

# Serialize OSTRA deploys. The FTP deployment uploads each file as a
# `.deploytmp` then renames it into place (rsync does the same with
# `.~tmp~` and also deletes); two deploys running at once
# race on those temp files and the loser dies with "Overwrite permission
# denied". A burst of merges to `main` (e.g. several Dependabot PRs in
# quick succession) otherwise launches one concurrent deploy per merge.
# `cancel-in-progress: false` lets an in-flight sync finish rather than
# being killed mid-upload, which could leave prod half-updated; later
# deploys queue and run one after another.
# A dry run changes nothing, so it gets its own group: in the shared one it
# would replace the single pending real deploy, which GitHub cancels.
# A run on the wrong branch is refused at once, so it gets a group of its own for the same reason.
concurrency:
    group: ${{ github.ref != 'refs/heads/main' && format('deploy-ostra-refused-{0}', github.run_id) || (inputs.dry_run && 'deploy-ostra-dry-run' || 'deploy-ostra') }}
    cancel-in-progress: false

jobs:
    # nasad.php picks the settings by branch name; a manual run on beta would put the BETA settings into the ostra directory.
    check-branch:
        runs-on: ubuntu-24.04

        steps:
            -   name: Refuse to deploy OSTRA from another branch
                if: github.ref != 'refs/heads/main'
                run: |
                    echo "::error::Deploy OSTRA runs only on the main branch; choose 'main' under 'Use workflow from'"
                    exit 1

    publish:
        needs: check-branch
        runs-on: ubuntu-24.04

        steps:
            -   name: Checkout code
                uses: actions/checkout@v4

            -   name: Build and start containers
                run: docker compose up --build --detach

            -   name: Upload test output as artifact
                if: always()
                uses: actions/upload-artifact@v4
                with:
                    name: php-test-logs
                    path: ./tests/logs

            -   name: Fix Composer git safe directory issue
                run: |
                    dir=$(docker compose exec -T web pwd)
                    docker compose exec -T web git config --global --add safe.directory "$dir"

            -   name: Composer libraries with dev
                run: docker compose exec --no-TTY --user www-data web composer install

            -   name: Run tests in container
                run: make tests-be

            -   name: Upload test output as artifact
                if: always()
                uses: actions/upload-artifact@v4
                with:
                    name: php-test-logs
                    path: ./tests/logs

            -   name: Composer libraries without dev
                run: docker compose exec --no-TTY --user www-data web composer install --no-dev --optimize-autoloader

            -   name: Deploy via rsync, or via FTP while DEPLOY_RSYNC_TARGET is not set
                # testy provádíme zvlášť, abychom neměli output z deploye moc dlouhý; změny nekontrolujeme, protože jsme je vytvořili přes `composer install --no-dev`
                run: php ./udrzba/nasad.php --skip-tests --skip-no-changes-check ${{ inputs.dry_run && '--dry-run' || '' }}
                env:
                    FTP_DIR: ostra
                    FTP_BASE_URL: ${{ secrets.FTP_BASE_URL }}
                    # Ostra has its own key, allowed to write only to the ostra directory; beta has another.
                    DEPLOY_RSYNC_TARGET: ${{ secrets.OSTRA_DEPLOY_RSYNC_TARGET }}
                    DEPLOY_SSH_KEY: ${{ secrets.OSTRA_DEPLOY_SSH_KEY }}
                    DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
                    # Optional repository variables; empty means port 22 and at most 500 deleted items (files and folders) outside vendor/ and 5000 in it.
                    DEPLOY_SSH_PORT: ${{ vars.DEPLOY_SSH_PORT }}
                    DEPLOY_RSYNC_MAX_DELETE: ${{ vars.DEPLOY_RSYNC_MAX_DELETE }}
                    DEPLOY_RSYNC_MAX_DELETE_VENDOR: ${{ vars.DEPLOY_RSYNC_MAX_DELETE_VENDOR }}
                    DB_USER: ${{ secrets.OSTRA_DB_USER }}
                    DB_PASS: ${{ secrets.OSTRA_DB_PASS }}
                    DB_NAME: ${{ secrets.OSTRA_DB_NAME }}
                    DB_SERV: localhost
                    DBM_USER: ${{ secrets.OSTRA_DBM_USER }}
                    DBM_PASS: ${{ secrets.OSTRA_DBM_PASS }}
                    DB_READONLY_USER: ${{ secrets.OSTRA_DB_READONLY_USER }}
                    DB_READONLY_PASS: ${{ secrets.OSTRA_DB_READONLY_PASS }}
                    MIGRACE_HESLO: ${{ secrets.OSTRA_MIGRACE_HESLO }}
                    SECRET_CRYPTO_KEY: ${{ secrets.OSTRA_SECRET_CRYPTO_KEY }}
                    # pozor změnu CRON_KEY je nutné provést i
                    # v https://console.cron-job.org
                    CRON_KEY: ${{ secrets.OSTRA_CRON_KEY }}
                    GOOGLE_API_CREDENTIALS: ${{ secrets.OSTRA_GOOGLE_API_CREDENTIALS }}
                    FIO_TOKEN: ${{ secrets.OSTRA_FIO_TOKEN }}
                    MAILER_DSN: ${{ secrets.MAILER_DSN }}
                    SERVER_NAME: 'gamecon.cz'
                    DB_ANONYM_SERV: ${{ secrets.DB_ANONYM_SERV }}
                    DB_ANONYM_USER: ${{ secrets.DB_ANONYM_USER }}
                    DB_ANONYM_PASS: ${{ secrets.DB_ANONYM_PASS }}
                    DB_ANONYM_NAME: ${{ secrets.DB_ANONYM_NAME }}
                    APP_ENV: prod
                    APP_DEBUG: 0
                    APP_SECRET: ${{ secrets.OSTRA_APP_SECRET }}
                    PREVIEW_BASIC_AUTH_USER: ${{ secrets.PREVIEW_BASIC_AUTH_USER }}
                    PREVIEW_BASIC_AUTH_PASSWORD: ${{ secrets.PREVIEW_BASIC_AUTH_PASSWORD }}
                    ARCHIVE_BASIC_AUTH_USER: ${{ secrets.ARCHIVE_BASIC_AUTH_USER }}
                    ARCHIVE_BASIC_AUTH_PASSWORD: ${{ secrets.ARCHIVE_BASIC_AUTH_PASSWORD }}
                    # Gate-token signing secrets — admin podepisuje ?gate=
                    # odkazy, gate-validator za bránou je ověřuje. Musí být
                    # shodné s preview.gate.secret / year_archive.gate.secret
                    # v ansible secrets.yaml.
                    PREVIEW_GATE_SECRET: ${{ secrets.PREVIEW_GATE_SECRET }}
                    ARCHIVE_GATE_SECRET: ${{ secrets.ARCHIVE_GATE_SECRET }}
                    # Master tajemství pro magické přihlášení do archivu (?gcsso=).
                    # JEN ostrá — z něj odvozuje klíč pro daný ročník. Archivy dostanou
                    # jen odvozený klíč (ne tohle), takže popadený archiv master neunese.
                    GAMECON_SSO_SECRET: ${{ secrets.GAMECON_SSO_SECRET }}
                    # Přihlášení do Vševědy. JEN ostrá: beta ani preview ho nedostanou, jinak by si
                    # přihlášení mohla podepsat libovolná větev. Shodné s vseveda.sso.secret v ansiblu.
                    VSEVEDA_SSO_SECRET: ${{ secrets.VSEVEDA_SSO_SECRET }}
