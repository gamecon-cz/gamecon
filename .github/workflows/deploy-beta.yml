name: Deploy BETA on direct push or merged pull request

# yamllint disable-line rule:truthy
on:
    push:
        branches:
            - 'beta'
    workflow_dispatch:
        inputs:
            dry_run:
                description: 'Only list what rsync would upload and delete; nothing changes'
                type: boolean
                default: false

# Serialize BETA deploys for the same reason as OSTRA: concurrent syncs
# race on temp files (FTP `.deploytmp`, rsync `.~tmp~`) and on deletions.
# A separate group from ostra (different target) so the two
# never block each other. `cancel-in-progress: false` so an in-flight
# sync completes instead of being killed mid-upload.
# A dry run changes nothing, so it gets its own group: in the shared one it
# would replace the single pending real deploy, which GitHub cancels.
# A run on the wrong branch is refused at once, so it gets a group of its own for the same reason.
concurrency:
    group: ${{ github.ref != 'refs/heads/beta' && format('deploy-beta-refused-{0}', github.run_id) || (inputs.dry_run && 'deploy-beta-dry-run' || 'deploy-beta') }}
    cancel-in-progress: false

jobs:
    # nasad.php picks the settings by branch name; a manual run on main would put the OSTRA settings into the beta directory.
    check-branch:
        runs-on: ubuntu-24.04

        steps:
            -   name: Refuse to deploy BETA from another branch
                if: github.ref != 'refs/heads/beta'
                run: |
                    echo "::error::Deploy BETA runs only on the beta branch; choose 'beta' under 'Use workflow from'"
                    exit 1

    publish:
        needs: check-branch
        runs-on: ubuntu-24.04

        steps:
            -   name: Checkout code
                uses: actions/checkout@v4

            -   name: Build and start containers
                run: docker compose up --build --detach

            -   name: Fix Composer git safe directory issue
                run: |
                    dir=$(docker compose exec -T web pwd)
                    docker compose exec -T web git config --global --add safe.directory "$dir"

            -   name: Composer libraries with dev
                run: docker compose exec --no-TTY web composer install

            -   name: Run tests in container
                run: make tests-be

            -   name: Upload test output as artifact
                if: always()
                uses: actions/upload-artifact@v4
                with:
                    name: php-test-logs
                    path: ./tests/logs

            -   name: Composer libraries without dev
                run: docker compose exec --no-TTY --user www-data web composer install --no-dev --optimize-autoloader

            -   name: Deploy via rsync, or via FTP while DEPLOY_RSYNC_TARGET is not set
                # testy provádíme zvlášť, abychom neměli output z deploye moc dlouhý; změny nekontrolujeme, protože jsme je vytvořili přes `composer install --no-dev`
                run: php ./udrzba/nasad.php --skip-tests --skip-no-changes-check ${{ inputs.dry_run && '--dry-run' || '' }}
                env:
                    FTP_DIR: beta
                    FTP_BASE_URL: ${{ secrets.FTP_BASE_URL }}
                    # Beta has its own key, allowed to write only to the beta directory; ostra has another.
                    DEPLOY_RSYNC_TARGET: ${{ secrets.BETA_DEPLOY_RSYNC_TARGET }}
                    DEPLOY_SSH_KEY: ${{ secrets.BETA_DEPLOY_SSH_KEY }}
                    DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
                    # Optional repository variables; empty means port 22 and at most 500 deleted items (files and folders) outside vendor/ and 5000 in it.
                    DEPLOY_SSH_PORT: ${{ vars.DEPLOY_SSH_PORT }}
                    DEPLOY_RSYNC_MAX_DELETE_PROJECT: ${{ vars.DEPLOY_RSYNC_MAX_DELETE_PROJECT }}
                    DEPLOY_RSYNC_MAX_DELETE_VENDOR: ${{ vars.DEPLOY_RSYNC_MAX_DELETE_VENDOR }}
                    DB_USER: ${{ secrets.BETA_DB_USER }}
                    DB_PASS: ${{ secrets.BETA_DB_PASS }}
                    DB_NAME: ${{ secrets.BETA_DB_NAME }}
                    DB_SERV: localhost
                    DBM_USER: ${{ secrets.BETA_DBM_USER }}
                    DBM_PASS: ${{ secrets.BETA_DBM_PASS }}
                    DB_READONLY_USER: ${{ secrets.BETA_DB_READONLY_USER }}
                    DB_READONLY_PASS: ${{ secrets.BETA_DB_READONLY_PASS }}
                    MIGRACE_HESLO: ${{ secrets.BETA_MIGRACE_HESLO }}
                    SECRET_CRYPTO_KEY: ${{ secrets.BETA_SECRET_CRYPTO_KEY }}
                    # pozor změnu CRON_KEY je nutné provést i
                    # v https://console.cron-job.org
                    CRON_KEY: ${{ secrets.BETA_CRON_KEY }}
                    GOOGLE_API_CREDENTIALS: ${{ secrets.BETA_GOOGLE_API_CREDENTIALS }}
                    FIO_TOKEN: ${{ secrets.BETA_FIO_TOKEN }}
                    MAILER_DSN: ${{ secrets.MAILER_DSN }}
                    SERVER_NAME: 'beta.gamecon.cz'
                    DB_ANONYM_SERV: ${{ secrets.DB_ANONYM_SERV }}
                    DB_ANONYM_USER: ${{ secrets.DB_ANONYM_USER }}
                    DB_ANONYM_PASS: ${{ secrets.DB_ANONYM_PASS }}
                    DB_ANONYM_NAME: ${{ secrets.DB_ANONYM_NAME }}
                    APP_ENV: prod
                    APP_DEBUG: 0
                    APP_SECRET: ${{ secrets.BETA_APP_SECRET }}
                    PREVIEW_BASIC_AUTH_USER: ${{ secrets.PREVIEW_BASIC_AUTH_USER }}
                    PREVIEW_BASIC_AUTH_PASSWORD: ${{ secrets.PREVIEW_BASIC_AUTH_PASSWORD }}
                    ARCHIVE_BASIC_AUTH_USER: ${{ secrets.ARCHIVE_BASIC_AUTH_USER }}
                    ARCHIVE_BASIC_AUTH_PASSWORD: ${{ secrets.ARCHIVE_BASIC_AUTH_PASSWORD }}
                    # Gate-token signing secrets (viz deploy-ostra.yml).
                    PREVIEW_GATE_SECRET: ${{ secrets.PREVIEW_GATE_SECRET }}
                    ARCHIVE_GATE_SECRET: ${{ secrets.ARCHIVE_GATE_SECRET }}
                    # Master pro magické přihlášení do archivu (viz deploy-ostra.yml).
                    GAMECON_SSO_SECRET: ${{ secrets.GAMECON_SSO_SECRET }}
