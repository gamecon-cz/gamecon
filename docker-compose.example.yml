# docker compose pull && docker compose up --build
version: "3"
services:

  web:
    # Mount a host crontab into /.docker/cron/<name>. init-container.sh copies it to
    # /etc/cron.d/<name> with root ownership and 644 perms (cron rejects files in
    # /etc/cron.d that are not root-owned or are group/other-writable).
    # Lines must include the user column, e.g.:
    #   0 * * * * www-data curl -s "http://localhost/admin/cron.php?key=..."
    volumes:
      - ./.docker/cron/gamecon:/.docker/cron/gamecon:ro
      # Posun času pro diferenční scénáře (bin-diff/cas.sh). Bez tohohle mountu
      # a proměnné níž se čas neposune a scénáře tiše běží na skutečném datu.
      # Samotná .ini je nečinná, dokud není GAMECON_DIFF_DATUM nastavené.
      - ./.docker/php/conf.d/diff-cestovani.ini:/usr/local/etc/php/conf.d/diff-cestovani.ini:ro
    environment:
      GAMECON_DIFF_DATUM: "${GAMECON_DIFF_DATUM:-}"

  sql.gamecon:
    restart: always

  phpmyadmin:
    restart: always

  mailhog.gamecon:
    restart: always
