        upresnime: Přihlašování na GameCon bude spuštěno (upřesníme).
    uzavreno: "Přihlašování na GameCon je uzavřeno od {konec, date,d. M. y} {konec, time,HH:mm:ss}."
    po_gc:
        dekujeme: Děkujeme za tvou účast na GameConu! Budeme moc rádi za jakoukoliv {zpetna_vazba}, abychom věděli, co zlepšit, případně co určitě nevynechat ani v příštích letech.
