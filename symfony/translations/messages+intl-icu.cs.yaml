        zpetna_vazba_titulek: Zpětná vazba
        sledujte_nas: Budeme se těšit zase za rok, do té doby nás můžeš sledovat na {facebook}, {instagram} nebo na {discord}.
        neucastnil_se: GameCon už proběhl, těšíme se na viděnou v roce {rok}.
        fotky: Fotky z předešlých ročníků najdeš na našem {facebook} nebo {instagram}. Přidej se k nám na {discord}, aby ti neutekly žádné novinky.
        # „na Facebooku“, „na Discordu“ / „na Discord“ (kam)
        facebook: Facebooku
        instagram: Instagramu
        discord_kde: Discordu
        discord_kam: Discord
        facebook_titulek: Facebook GameConu
        instagram_titulek: Instagram GameConu
        discord_titulek: Discord GameConu
    behem_gc:
        na_infopultu: Přihlášku již nelze upravovat online, případné změny je {jen_na_miste}.
        jen_na_miste: momentálně možné provádět pouze na místě u Infopultu
        prehled_objednavek: Přehled svých objednávek a plateb najdeš v záložce {finance} na svém profilu.
        vitame: Vítáme tě na GameConu! Přihlášku již nelze upravovat online, veškeré případné změny v přihlášce proto řeš na Infopultu, přehled plateb najdeš v záložce {finance} na svém profilu.
        finance: finance
    prihlasen:
        aktivni: Tvá přihláška na GameCon {rok} je aktivní! Nyní můžeš upravovat objednané ubytování i předměty až téměř do začátku GameConu.
        uhradit_do: "Objednávku je potřeba uhradit do {do, date,d. M.} včetně."
        prehled_financi: Svůj přehled financí a údaje k platbě najdeš v {odkaz}.
        prehled_financi_odkaz: Přehledu financí
    neprihlasen: Vyplněním údajů se přihlásíš na GameCon {rok}. Můžeš si vybrat předměty s GameCon tématikou a ubytování, které budeš chtít. Výběr jde i později změnit.
    souhlas_rodicu:
        text: Jakožto mladší 15ti let budeš potřebovat dodat potvrzení o souhlasu tvého zákonného zástupce s účastí na GameConu. Formulář ke stažení můžeš najít na {odkaz} a vyplněný nám jej můžeš kdykoliv před příjezdem na GameCon nahrát pomocí tohoto formuláře, nebo donést fyzicky při příjezdu na GameCon k Infopultu. Připravené formuláře k vyplnění budeme mít i na Infopultu.
        odkaz: tomto odkazu
        odeslat: Odeslat
        nahrano: Potvrzení je úspěšně nahrané ✅
        zobrazit: (zobrazit)
        chybi: Nejdříve vlož potvrzení.
        ulozeno: Potvrzení bylo uloženo.
        nelze_otevrit: Soubor ''{soubor}'' se nepodařilo načíst
        nelze_ulozit: Soubor ''{soubor}'' se nepodařilo uložit
        neni_obrazek: Soubor ''{soubor}'' se nepodařilo přečíst. Je to obrázek nebo PDF?
    predmety:
        nadpis: Předměty
        info: Placky, kostky, mikiny i trička s logem GameConu si můžeš objednat ve více kusech. Stačí kliknout na tlačítko ➕. U triček a mikin se po vyplnění jednoho automaticky zobrazí možnost přidat další.
