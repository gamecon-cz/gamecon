titulka:
    info:
        nazev: GameCon – největší festival nepočítačových her
        popis: GameCon je největší festival nepočítačových her v České republice, který se každoročně koná třetí víkend v červenci. Opět se můžete těšit na desítky RPGček, deskovek, larpů, akčních her, wargaming, přednášky, klání v Příbězích Impéria, tradiční mistrovství v DrD a v neposlední řadě úžasné lidi a vůbec zážitky, které ve vás přetrvají minimálně do dalšího roku.
    hlavicka:
        claim: Největší festival nepočítačových her
        zacatek: "{zacatek, date,d.}"
        konec: "{konec, date,d. M.}"
        prehrat_video: přehrát video
    karty:
        pro_vsechny:
            nadpis: Akce pro všechny
            text: Na Gameconu si najde každý fanoušek aktivní zábavy a nepočítačových her to svoje, bez ohledu na věk.
        aktivni_zabava:
            nadpis: Festival aktivní zábavy
            text: Na GameConu najdeš všechno od celodenně otevřené deskoherny, přes rolové hry až po koncert.
        zadne_vstupne:
            nadpis: Žádné vstupné
            text: Registrace na GameCon je zdarma. Platíš jen za služby a aktivity, které si sám vybereš a objednáš.
    popisbox:
        # odkazy dosadí titulka.php, slovosled je na překladu
        veta: "{deskove} hry, {rpg} a {larpy}, {akcni_hry}, {wargaming}, {turnaj} v D&D/JaD, pohybové {workshopy}, koncert a párty. To všechno a mnohem víc je festival nepočítačových her GameCon."
        odkaz:
            deskove: Deskové
            rpg: RPG
            larpy: Larpy
            akcni_hry: akční hry
            wargaming: wargaming
            turnaj: Turnaj
            workshopy: workshopy
