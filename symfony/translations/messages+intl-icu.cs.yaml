        min_dve_noci: Ubytování je možné objednat minimálně na 2 navazující noci.
        nedele: "Varianta „Ne–Po“ znamená noc z neděle na pondělí, kdy už neprobíhá program. V pondělí je potřeba pokoj vyklidit do 9:00."
        snidane: Hotelové pokoje mají v ceně zahrnutou snídani.
        podrobnosti: Podrobnější informace o ubytování a typech pokojů najdeš na stránce {odkaz}.
        prakticke_informace: Praktické informace
        bonus_vypravece: Každý vypravěč má nárok na bonus odvíjející se od množství vyprávěných aktivit, který se dá uplatnit na ubytování, jídlo a aktivity. Přesnou výšku svého bonusu najdeš po dokončení registrace ve svém {odkaz}.
        bonus_vypravece_odkaz: finančním přehledu
        zdarma_organizatorovi: Jako {pohlavi, select, f {organizátorka} other {organizátor}} máš veškeré ubytování zdarma.
    jidlo:
        nadpis: Jídlo
        info: Informace ke stravování
        zmeny_do: "Jídlo je možné objednat nebo zrušit do {do, date,d.\u00A0M.}"
        vyber: Na výběr je z 3–5 jídel, která jsou vždy stejná na oběd i večeři a jedno vegetariánské jídlo.
        jidelnicek: Jídelníček je k dispozici {odkaz}.
        jidelnicek_odkaz: zde
    vstupne:
        dekujeme: Děkujeme!
        prispevky: Příspěvků formou dobrovolného vstupného si moc vážíme a děkujeme za ně. I díky nim dokážeme GameCon každý rok dělat o něco lepší!
        nadpis: Dobrovolné vstupné
    pomoc:
        nadpis: Chceš se zapojit do organizace?
        dobrovolnik: Pokud chceš jako dobrovolník pomoct s přípravou na místě, přihlaš se v {odkaz} na některou z dobrovolnických aktivit (Příprava, Úklid).
        dobrovolnik_odkaz: programu
        vypravec: Jestli tě láká vedení nějaké aktivity, kontaktuj vedoucího dané programové sekce. Kontakt na něj najdeš na příslušné podstránce Aktivit.
        sponzoring: V případě, že bys chtěl/a GameCon podpořit sponzoringem, vše potřebné najdeš {odkaz}.
        sponzoring_odkaz: zde
        organizace: A jestliže chceš přiložit ruku k dílu a zapojit se do celoroční organizace, bližší informace najdeš {odkaz}.
        organizace_odkaz: tady
        vice: "Zde můžeš napsat více o tom, jak se chceš zapojit. Hlas se prosím o výpomoc jen u věcí, které zatím nemáš s nikým domluvené:"
        typ:
            dobrovolnik: Dobrovolníci
            dobrovolnik_popis: Za to, že je GameCon takový jaký je, vděčíme nejen vypravěčům a organizátorům, ale i dobrovolníkům, kteří pomáhají vybudovat jeho zázemí. Pomoc potřebujeme především s přípravou prostor (nošení stolů, lepení plakátů apod), Infopultem a hermanováním v deskoherně.
            vypravec: Vypravěči
            vypravec_popis: Vypravěč je jednotný pojem, který GameCon používá pro všechny, kteří vedou některou z aktivit – ať už se jedná o deskovku, RPG, larp či jinou hru. Napadá tě nějaká aktivita, kterou chceš uvést?
            organizator: Organizatoři
            organizator_popis: Máš organizační talent, nebo tě napadá konkrétní věc, se kterou nám můžeš pomoct? Spíš než profesionály hledáme samostatné aktivní jedince, kteří se budou rádi podílet na chodu středně velké organizace.
            partner: Partner GameConu
            partner_popis: Chceš propagovat svou značku na festivalu pro více než 800 lidí? Podpořit GameCon (nejen) finančně, či mít přímo na festivalu stánek?
    ulozit_zmeny: Uložit změny
    prihlasit: Přihlásit na GameCon
    odhlasit: Odhlásit se z GameConu
    odhlasit_potvrzeni: Odhlášení z GameConu zruší všechny tvé registrace na aktivity a nákupy předmětů. Kliknutím na OK se odhlásíš.
    odhlaseni_behem_gc: Během Gameconu se nemůžeš {pohlavi, select, f {sama} other {sám}} odhlást. Stav se na infopultu.
    odhlaseno: Odhlášení z GameConu {rok} proběhlo úspěšně
    prihlaseno: Přihlášení na GameCon {rok} proběhlo úspěšně
    aktualizovano: Přihláška aktualizována.

