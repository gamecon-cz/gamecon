        velikosti_mikin_odkaz: zde
        zmeny_do: "Výběr mikin můžeš upravovat do {mikiny, date,d.\u00A0M.}, ostatní merch do {ostatni, date,d.\u00A0M.}"
        slevy: "Jako {titul} máš nárok na následující bonusy (pokud si je objednáš): {slevy}."
    ubytovani:
        nadpis: Ubytování
        ikona: Ikona s mapou
        info: Informace k ubytování
        zmeny_do: "Objednat nebo změnit ubytování můžeš do {do, date,d.\u00A0M.}."
        kapacita: Čísla ukazují počet obsazených míst / celkovou kapacitu.
        od_stredy: Ubytování je k dispozici od středy, program začíná ve {ctvrtek} v poledne.
