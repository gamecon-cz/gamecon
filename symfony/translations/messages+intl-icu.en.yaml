titulka:
    info:
        nazev: GameCon – the largest festival of non-computer games
        popis: GameCon is the largest festival of non-computer games in the Czech Republic, held every year on the third weekend of July. Once again you can look forward to dozens of RPGs, board games, larps, action games, wargaming, talks, contests in Tales of the Empire, the traditional DrD Championship and, last but not least, amazing people and experiences that will stay with you at least until next year.
    hlavicka:
        claim: The largest festival of non-computer games
        zacatek: "{zacatek, date,d}"
        konec: "{konec, date,d MMMM}"
        prehrat_video: play video
    karty:
        pro_vsechny:
            nadpis: Something for everyone
            text: Every fan of active fun and non-computer games will find something to enjoy at GameCon.
        aktivni_zabava:
            nadpis: A festival of active fun
            text: At GameCon you’ll find everything from a board game library open all day, through role-playing games, to a concert.
        zadne_vstupne:
            nadpis: No entry fee
            text: Registration for GameCon is free. You only pay for the services and activities you choose and order yourself.
    popisbox:
