titulka:
    info:
        nazev: GameCon – the largest festival of non-computer games
        popis: GameCon is the largest festival of non-computer games in the Czech Republic, held every year on the third weekend of July. Once again you can look forward to dozens of RPGs, board games, larps, action games, wargaming, talks, contests in Tales of the Empire, the traditional DrD Championship and, last but not least, amazing people and experiences that will stay with you at least until next year.
    hlavicka:
        claim: The largest festival of non-computer games
        zacatek: "{zacatek, date,d}"
        konec: "{konec, date,d MMMM}"
        prehrat_video: play video
    karty:
        pro_vsechny:
            nadpis: Something for everyone
            text: Every fan of active fun and non-computer games will find something to enjoy at GameCon.
        aktivni_zabava:
            nadpis: A festival of active fun
            text: At GameCon you’ll find everything from a board game library open all day, through role-playing games, to a concert.
        zadne_vstupne:
            nadpis: No entry fee
            text: Registration for GameCon is free. You only pay for the services and activities you choose and order yourself.
    popisbox:
        # titulka.php puts in the links, the word order is up to the translation
        veta: "{deskove}, {rpg} and {larpy}, {akcni_hry}, {wargaming}, a {turnaj}, movement {workshopy}, a concert and a party. All this and much more is GameCon, the festival of non-computer games."
        odkaz:
            deskove: Board games
            rpg: RPGs
            larpy: larps
            akcni_hry: action games
            wargaming: wargaming
            turnaj: D&D tournament
            workshopy: workshops
    cisla:
        ikona_ucastniku: participants icon
        ikona_aktivit: activities icon
        ikona_trvani: duration icon
        ikona_koncertu: concert icon
        spokojenych_ucastniku: happy participants
        ruznych_aktivit: different activities
        dny_zabavy: days of fun
        super_koncert: awesome concert
    fotky:
        koncert: Concert
    linie:
        nadpis: What’s waiting for you at GameCon?
    odpocet:
        prihlasovani_zacne: Registration opens on {zacatek, date,d MMMM y} at {zacatek, time,HH:mm}
        do_gameconu_zbyva: GameCon starts in
        prihlasit_se: Register
    sponzori: Thank you to our sponsors and partners!

