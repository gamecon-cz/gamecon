api_platform:
    # Replaces API Platform's own map, so its three defaults are repeated first.
    exception_to_status:
        Symfony\Component\Serializer\Exception\ExceptionInterface: 400
        ApiPlatform\Metadata\Exception\InvalidArgumentException: 400
        Doctrine\ORM\OptimisticLockException: 409
        App\Exception\InvalidRequestException: 400
        App\Exception\InsufficientPermissionsException: 403
        App\Exception\CapacityExceededException: 409
        App\Exception\NoLongerAvailableException: 409
