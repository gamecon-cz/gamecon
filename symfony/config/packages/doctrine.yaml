doctrine:
    dbal:
        default_connection: default
        connections:
            default:
                driver: pdo_mysql
                host: '%gamecon.db.host%'
                port: '%gamecon.db.port%'
                dbname: '%gamecon.db.name%'
                user: '%gamecon.db.user%'
                password: '%gamecon.db.password%'
                charset: utf8mb4
                wrapper_class: App\Doctrine\SharedConnection
                # Legacy code shares this connection and was written against these session settings.
                options:
                    !php/const PDO::MYSQL_ATTR_INIT_COMMAND: 'SET NAMES utf8mb4 COLLATE utf8mb4_czech_ci, SESSION group_concat_max_len = 1048576'
                    !php/const PDO::ATTR_STRINGIFY_FETCHES: true
                    # pdo_mysql allows several statements in one query unless told otherwise
                    !php/const PDO::MYSQL_ATTR_MULTI_STATEMENTS: false
                profiling_collect_backtrace: '%kernel.debug%'
                use_savepoints: true
                # Doctrine's idle-connection listener would close it, though another kernel may hold a transaction on it
                idle_connection_ttl: 0
                schema_filter: ~^(?!akce_lokace$)~ # Ignore akce_lokace (managed by legacy code)

    orm:
        auto_generate_proxy_classes: true
        enable_lazy_ghost_objects: true
        report_fields_where_declared: true
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        mappings:
            App:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'
                alias: App
        controller_resolver:
            auto_mapping: false

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
#            dbname_suffix: '_test%env(default::TEST_TOKEN)%' # currently not needed because the test DB name is solved in nastaveni/verejne-nastaveni-tests.php

when@prod:
    doctrine:
        orm:
            auto_generate_proxy_classes: false
            proxy_dir: '%kernel.build_dir%/doctrine/orm/Proxies'
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
