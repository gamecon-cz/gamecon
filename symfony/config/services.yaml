parameters:
    # Database configuration - read from env vars set by legacy zavadec-zaklad.php
    gamecon.db.host: '%env(GAMECON_DB_HOST)%'
    gamecon.db.port: '%env(int:GAMECON_DB_PORT)%'
    gamecon.db.name: '%env(GAMECON_DB_NAME)%'
    gamecon.db.user: '%env(GAMECON_DB_USER)%'
    gamecon.db.password: '%env(GAMECON_DB_PASSWORD)%'
    app.secret: '%env(APP_SECRET)%'
    app.legacy_cache_dir: '%env(LEGACY_CACHE_DIR)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            $projectDir: '%kernel.project_dir%'

    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'
            - '../src/Entity/'
            - '../src/DependencyInjection/'
            - '../src/Doctrine/SharedConnection.php'

    # Every container in the process gets the same connection, which legacy dbQuery() uses too.
    app.doctrine.shared_connection:
        class: App\Doctrine\SharedConnection
        decorates: doctrine.dbal.default_connection
        factory: ['App\Doctrine\SharedConnection', 'share']
        arguments: ['@.inner']
        public: true
    App\Doctrine\SharedConnection:
        alias: app.doctrine.shared_connection

    # Pravidla slev se čtou legacy funkcí dbFetchAll — callable se nedá autowirovat.
    App\Discount\DiscountRuleLoader:
        arguments:
            $fetchAll: 'dbFetchAll'

    # Legacy integration services
    legacy.session:
        class: 'App\Service\LegacySessionService'
        public: true

    app.clock:
        decorates: 'clock'
        parent: 'clock'
        public: true

    # Accessible from legacy model/ layer via kernel container
    App\Service\AktivitaTymService:
        public: true

    # Volá ji import ubytování z Excelu, což je pořád legacy admin skript
    App\Service\AccommodationImport:
        public: true

    # Legacy Shop writes its purchases through these
    App\Service\CapacityManager:
        public: true
    App\Service\ManualSaleService:
        public: true
    App\Service\BulkCancelService:
        public: true
    # The legacy e-shop import keeps variants following its catalog rows through this
    App\Service\VariantStateMirror:
        public: true

    App\Repository\TeamRepository:
        public: true
    # UserRoleService - accessed from legacy code via container
    App\Service\UserRoleService:
        public: true
    # Completes a participant's order when the legacy infopult records their departure
    App\Service\OrderCompletionService:
        public: true

    # CurrentYearProvider
    App\Service\CurrentYearProviderInterface:
        class: App\Service\CurrentYearProvider

    # Reading the accommodation grid for a named customer, so the admin desk does not depend
    # on the API Platform provider contract (which always answers for the signed-in user).
    App\State\Cart\AccommodationGridInterface:
        alias: App\State\Cart\AccommodationProvider

    # JWT service for cross-app authentication
    App\Service\JwtService:
        public: true
        arguments:
            $secret: '%app.secret%' # Use the same secret as Symfony app
            $legacyCacheDir: '%app.legacy_cache_dir%' # Use cache directory that both apps can access

    # The legacy logout (revokeJwtsForUser in nastaveni/jwt-bridge.php) fetches it from the container
    App\Service\TokenVersionService:
        public: true
